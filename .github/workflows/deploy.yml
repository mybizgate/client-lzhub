# Production deployment for this Vue 3 + Vite client site.
#
# This site is built with `npm run build` (not the platform's static copy/minify engine),
# so it uses its own small workflow instead of mybizgate/mybizgate-platform's
# static-site-deploy.yml. The deployment target and secrets are the same ones the
# platform wizard provisioned: vars.DEPLOY_DIR (public_html/clients/lzhub/) and the
# FTP_* secrets. Pushing to `deploy` builds and uploads dist/.
name: Deploy Production

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

concurrency:
  group: production-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Resolve deployment target
        id: target
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
        run: |
          if [ -z "$DEPLOY_DIR" ]; then echo "DEPLOY_DIR variable is not set"; exit 1; fi
          case "$DEPLOY_DIR" in
            public_html/clients/*/) ;;
            *) echo "Clients may only deploy under public_html/clients/<slug>/ (got: $DEPLOY_DIR)"; exit 1 ;;
          esac
          # Same rule as the platform's resolveServerDir(): a dedicated FTP account is already
          # rooted at DEPLOY_DIR, so upload to "./"; a shared account needs the full path.
          FTP_ACCOUNT=$(sed -nE 's/^[[:space:]]*ftp_account:[[:space:]]*([a-z]+).*/\1/p' site.config.yml | head -1)
          if [ "$FTP_ACCOUNT" = "dedicated" ]; then SERVER_DIR="./"; else SERVER_DIR="$DEPLOY_DIR"; fi
          echo "ftp_account=$FTP_ACCOUNT  deploy_dir=$DEPLOY_DIR  server_dir=$SERVER_DIR"
          echo "server_dir=$SERVER_DIR" >> "$GITHUB_OUTPUT"

      - name: Build production dist/
        env:
          # Build-time configuration. VITE_* values are public; never put secrets here.
          VITE_CLIENT_CODE: ${{ vars.VITE_CLIENT_CODE || 'lzhub' }}
          VITE_DATA_MODE: ${{ vars.VITE_DATA_MODE || 'local' }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://api-client.mybizgate.com/api/v1' }}
          VITE_SITE_URL: https://${{ vars.SITE_DOMAIN }}
        run: npm run build

      - name: Check dist
        run: |
          test -f dist/index.html
          test -f dist/.htaccess
          ls -la dist dist/assets | head -40

      - name: Deploy dist/ via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ${{ steps.target.outputs.server_dir }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: Verify deployment
        env:
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          SITE_NAME: ${{ vars.SITE_NAME }}
        run: |
          # Require the built Vue shell (hashed asset + app root) and the site identity, so a stale
          # page that merely mentions the business name cannot pass.
          ASSET=$(grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' dist/index.html | head -1)
          for i in $(seq 1 20); do
            HTML=$(curl -fsSL "https://$SITE_DOMAIN/?nocache=$i" || true)
            if echo "$HTML" | grep -q 'id="app"' && echo "$HTML" | grep -q "$ASSET" && echo "$HTML" | grep -q "$SITE_NAME"; then
              echo "Live: https://$SITE_DOMAIN/ serving $ASSET"; exit 0
            fi
            sleep 15
          done
          echo "Site did not serve the new build ($ASSET) within 5 minutes"; exit 1

      - name: Tag release
        if: success()
        run: |
          TAG="prod-$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::8}"
          git config user.name "mybizgate-deploy[bot]"
          git config user.email "deploy@mybizgate.com"
          git tag -a "$TAG" -m "Production deployment $TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
